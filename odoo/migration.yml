migration:
  options:
    install_command: odoo.py
    # Workaround for https://github.com/odoo/odoo/pull/12730
    # Please remove once merged.
    # Warning: the DEMO flag will never be considered as we force
    # the 'without demo' mode
    install_args: --without-demo=all
  versions:
    - version: 9.0.0
      operations:
        pre:
          - anthem songs.install.pre::main
        post:
          - anthem openerp.addons.cloud_platform.songs::install_exoscale
          - anthem songs.install.accounting::main
          - anthem songs.install.product::main
          - anthem songs.install.logistics::main
          - anthem songs.install.sales::main
          - anthem songs.install.partner::main
          - anthem songs.install.user::main
          - anthem songs.install.data_all::main
      modes:
        full:
          operations:
            post:
              - importer.sh songs.install.data_full::import_suppliers /opt/odoo/data/install/supplier.csv
              - importer.sh songs.install.data_full::import_clients /opt/odoo/data/install/customer.csv
              - importer.sh songs.install.data_full::import_products /opt/odoo/data/install/product.csv
              - importer.sh songs.install.data_full::import_product_supplierinfo /opt/odoo/data/install/supplierinfo.csv
              - importer.sh songs.install.data_full::import_pricelist_items /opt/odoo/data/install/pricelist_items.csv
              - anthem songs.install.data_full::main

        demo:
          operations:
            post:
              - anthem songs.install.data_demo::main
      addons:
        upgrade:
          #### core
          - account
          - account_accountant
          - document
          - sale
          - sale_stock
          - stock
          - product_expiry
          - purchase
          - l10n_be_invoice_bba
          - l10n_be_intrastat
          - warning
          #camptocamp/cloud-platform
          - cloud_platform
          #### external-src
          - mail_environment
          - sale_exception
          - server_environment
          - account_chart_update
          - l10n_be_antibiotic_tax
          - l10n_be_apb_tax
          - l10n_be_eco_tax
          - account_banking_sepa_direct_debit
          #### local-src
          - claim_from_reception
          - delivery_rounds
          - delivery_rounds_assign
          - pricelist_discount
          - procurement_sale
          - product_price_category
          - sale_product_additional
          - specific_base
          - specific_account
          - specific_sale
          - specific_partner
          - specific_product
          - specific_stock
          - specific_translations
          - stock_barcode_fix
          - stock_grn
          - stock_groupbypartner
          - stock_lot_update
          - stock_picking_assignment
          - stock_picking_fillwithstock
          - stock_picking_sequence
          - stock_picking_subcode
          - stock_product_bin
          - stock_production_lot_expired_dates
          - stock_putaway_defaultfixedlocation
          - stock_quant_bylocation
          - stock_refill
          - web_autorefresh
          - stock_expired
          - refund_invoice
