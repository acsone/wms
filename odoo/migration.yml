migration:
  options:
    install_command: odoo
  versions:
    - version: 10.0.0
      operations:
        pre:
          # ***********************************************************
          # ************* Avoid auto-install chart of accounts ********
          # ***********************************************************
          - anthem songs.install.pre::main
          # Install account without l10n to avoid auto install
          - odoo -i account --stop-after-init --workers=0
          - anthem songs.install.accounting::no_coa_instance_lock
          - odoo -i l10n_be                --stop-after-init --workers=0
          - odoo -i l10n_be_antibiotic_tax --stop-after-init --workers=0
          - odoo -i l10n_be_apb_tax        --stop-after-init --workers=0
          - odoo -i l10n_be_eco_tax        --stop-after-init --workers=0
          - anthem songs.install.accounting::no_coa_instance_unlock
          - anthem songs.install.pre::setup_company
        post:
          # Because this module is auto-install when sale_stock is installed.
          # And the specific module 'procurement_sale' is incompatible with 'procurement_jit' module
          - anthem songs.install.unistall_procurement_jit_module::main

          - anthem openerp.addons.cloud_platform.songs::install_exoscale
          - anthem songs.install.accounting::main
          - anthem songs.install.product::main
          - anthem songs.install.logistics::main
          - anthem songs.install.sales::main
          - anthem songs.install.purchases::main
          - anthem songs.install.partner::main
          - anthem songs.install.user::main
          - anthem songs.install.data_all::main
      modes:
        full:
          operations:
            post:
              - bin/importer.sh songs.install.data_full::import_suppliers /opt/odoo/data/install/supplier.csv
              - bin/importer.sh songs.install.data_full::import_clients /opt/odoo/data/install/customer.csv
              - bin/importer.sh songs.install.data_full::import_products /opt/odoo/data/install/product.csv
              - anthem songs.install.data_full::post_import_products
              - anthem songs.install.data_full::import_wh_family_locations
              - bin/importer.sh songs.install.data_full::import_wh_locations /opt/odoo/data/install/location.csv
              - anthem songs.install.data_full::import_other_locations
              - anthem songs.install.data_full::location_compute_parents
              - bin/importer.sh songs.install.data_full::import_product_supplierinfo /opt/odoo/data/install/supplierinfo.csv
              - bin/importer.sh songs.install.data_full::import_pricelist_items /opt/odoo/data/install/pricelist_items.csv
              - anthem songs.install.data_full::main

        demo:
          operations:
            post:
              - anthem songs.install.data_demo::main
      addons:
        upgrade:
          ### Odoo
          # src
          - account
          - account_accountant
          - document
          - l10n_be_intrastat
          - l10n_be_invoice_bba
          - product_expiry
          - purchase
          - sale
          - sale_stock
          - stock
          # enterprise
          - helpdesk
          ### Camptocamp
          # camptocamp/cloud-platform
          - cloud_platform
          ### OCA (external-src)
          # oca/account-analytic
          - account_analytic_required
          # oca/account-closing
          - account_cutoff_accrual_picking
          # OCA/account-financial-tools
          - account_credit_control
          # oca/account-invoicing
          - account_invoice_check_total
          # oca/bank-payment
          - account_banking_sepa_credit_transfer
          - account_banking_sepa_direct_debit
          - account_invoice_tax_required
          # oca/sale-workflow
          - sale_exception
          # oca/server-tools
          - base_exception
          - mail_environment
          - server_environment
          # oca/stock-logistics-warehouse
          - stock_available_immediately
          # OCA/stock-logistics-workflow
          - stock_picking_invoice_link
          ### local-src
          - account_invoice_tax_required
          - connector_esb
          - delivery_rounds
          - delivery_rounds_assign
          - pricelist_discount
          - procurement_sale
          - product_price_category
          - refund_invoice
          - sale_product_additional
          - specific_account
          - specific_base
          - specific_data
          - specific_helpdesk
          - specific_partner
          - specific_print
          - specific_product
          - specific_purchase
          - specific_purchase_report
          - specific_report
          - specific_sale
          - specific_shipping_costs
          - specific_stock
          - specific_translations
          - specific_zetes
          - stock_barcode_fix
          - stock_expired
          - stock_grn
          - stock_groupbypartner
          - stock_location
          - stock_lot_track
          - stock_lot_update
          - stock_picking_assignment
          - stock_picking_fillwithstock
          - stock_picking_sequence
          - stock_picking_subcode
          - stock_product_bin
          - stock_production_lot_expired_dates
          - stock_putaway_defaultfixedlocation
          - stock_putaway_route
          - stock_quant_bylocation
          - stock_receive_lot
          - stock_reception_priority
          - stock_refill
          - web_autorefresh
