migration:
  options:
    install_command: odoo
  versions:
    - version: 10.0.0
      operations:
        pre:
          # ***********************************************************
          # ************* Avoid auto-install chart of accounts ********
          # ***********************************************************
          - anthem songs.install.pre::main
          # Install account without l10n to avoid auto install
          - odoo -i account --stop-after-init --workers=0
          - anthem songs.install.accounting::no_coa_instance_lock
          - odoo -i l10n_be                --stop-after-init --workers=0
          - odoo -i l10n_be_antibiotic_tax --stop-after-init --workers=0
          - odoo -i l10n_be_apb_tax        --stop-after-init --workers=0
          - odoo -i l10n_be_eco_tax        --stop-after-init --workers=0
          - odoo -i l10n_be_vat            --stop-after-init --workers=0
          - anthem songs.install.accounting::no_coa_instance_unlock
          - anthem songs.install.pre::setup_company
          # Install cloud platform if $C2C_PLATFORM == 'True'
          - bin/install_cloud_platform.sh
        post:
          # Because this module is auto-install when sale_stock is installed.
          # And the specific module 'procurement_sale' is incompatible with 'procurement_jit' module
          - anthem songs.install.uninstall_procurement_jit_module::main
          - anthem songs.install.post::main

          - anthem songs.install.accounting::main
          # To an unknown reason,
          # ir_values created in 'default_values'
          # doesn't take the good value
          # when we execute the function from main function.
          - anthem songs.install.accounting::default_values
          - anthem songs.install.product::main
          - anthem songs.install.logistics::main
          - anthem songs.install.sales::main
          - anthem songs.install.purchases::main
          - anthem songs.install.partner::main
          - anthem songs.install.user::main
          - anthem songs.install.data_all::main
          - anthem songs.install.product_category::main
      modes:
        full:
          operations:
            post:
              - bin/importer.sh songs.install.data_full::import_suppliers /opt/odoo/data/install/supplier.csv
              - bin/importer.sh songs.install.data_full::import_additional_suppliers_data /opt/odoo/data/install/supplier_add_data.csv
              - bin/importer.sh songs.install.data_full::import_clients /opt/odoo/data/install/customer.csv
              - bin/importer.sh songs.install.data_full::import_clients /opt/odoo/data/install/master_customer.csv
              - bin/importer.sh songs.install.data_full::import_clients_addresses /opt/odoo/data/install/customer_address.csv
              - bin/importer.sh songs.install.data_full::import_products /opt/odoo/data/install/product.csv
              - bin/importer.sh songs.install.data_full::import_products /opt/odoo/data/install/additional_product.csv
              - bin/importer.sh songs.install.data_full::import_products /opt/odoo/data/install/product_new_route_info.csv
              - anthem songs.install.data_full::post_import_products
              - anthem songs.install.data_full::import_wh_family_locations
              - bin/importer.sh songs.install.data_full::import_wh_locations /opt/odoo/data/install/location.csv
              - anthem songs.install.data_full::import_other_locations
              - anthem songs.install.data_full::location_compute_parents
              - bin/importer.sh songs.install.data_full::import_product_supplierinfo /opt/odoo/data/install/supplierinfo.csv product_tmpl_id/id
              - bin/importer.sh songs.install.data_full::import_product_supplierinfo /opt/odoo/data/install/supplierinfo_promo.csv product_tmpl_id/id
              - bin/importer.sh songs.install.data_full::import_pricelist_items /opt/odoo/data/install/pricelist_items.csv
              - anthem songs.install.data_full::main
              - bin/importer.sh songs.install.data_full::import_lots /opt/odoo/data/install/stock_production_lot.csv
              - "sh -c 'PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -f odoo/data/install/stock_production_lot_date_computation.sql $DB_NAME'"
              - anthem songs.install.data_full::import_inventory
              - anthem songs.install.data_full::import_inventory_without_lot
              - anthem songs.install.data_full::import_stock_bins
              - anthem songs.install.data_full::post_import_stock_bins
              - anthem songs.install.accounting::activate_check_on_vat
              - anthem songs.install.db2_import::main
              # The following modules need to be installed after the db2 data import
              - odoo -i base_partner_sequence --stop-after-init --workers=0
              - anthem songs.install.partner::setup_customer_ref
              - odoo -i product_sequence --stop-after-init --workers=0
              - anthem songs.install.product::setup_product_default_code_sequence
              # Create db2 tables and fill them with history data
              - "sh -c 'PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -f odoo/data/install/db2_pentcdcl_table.sql $DB_NAME'"
              - "sh -c 'PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -f odoo/data/install/db2_pdetcdcl_table.sql $DB_NAME'"
              - "sh -c 'PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -f odoo/data/install/db2_pentcdfo_table.sql $DB_NAME'"
              - "sh -c 'PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -f odoo/data/install/db2_pdetcdfo_table.sql $DB_NAME'"
              - "sh -c 'PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -f odoo/data/install/copy_from_pentcdcl.sql $DB_NAME'"
              - "sh -c 'PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -f odoo/data/install/copy_from_pdetcdcl.sql $DB_NAME'"
              - "sh -c 'PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -f odoo/data/install/copy_from_pentcdfo.sql $DB_NAME'"
              - "sh -c 'PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -f odoo/data/install/copy_from_pdetcdfo.sql $DB_NAME'"
        sample:
          operations:
            post:
              - anthem songs.sample.data_sample::main
              - anthem songs.install.accounting::activate_check_on_vat
              # The following modules need to be installed after the db2 data import
              - odoo -i base_partner_sequence --stop-after-init --workers=0
              - anthem songs.install.partner::setup_customer_ref
              - odoo -i product_sequence --stop-after-init --workers=0
              - anthem songs.install.product::setup_product_default_code_sequence
