# Root file for the dev composition.
#
# This contains the common configuration for all developers
#
# You can create a 'docker-compose.override.yml' to customize it according
# to your needs it will automatically be applied on top of this
version: '2'

services:
  odoo:
    build: ./odoo/
    depends_on:
      - db
    tty: true
    stdin_open: true
    ports:
      - 8069
      - 8072
    volumes:
      - "data-odoo:/data/odoo"
      - "data-odoo-db-cache:/opt/odoo/.cachedb"
      - "data-odoo-pytest-cache:/opt/odoo/.cache"
      - "./odoo/src:/opt/odoo/src"
      - "./odoo/local-src:/opt/odoo/local-src"
      - "./odoo/external-src:/opt/odoo/external-src"
      - "./odoo/songs:/opt/odoo/songs"
      - "./odoo/migration.yml:/opt/odoo/migration.yml"
      - "./odoo/data:/opt/odoo/data"
    environment:
      - DB_USER=odoo
      - DB_PASSWORD=odoo
      - DB_NAME=odoodb
      - ADMIN_PASSWD=mijaebohb8Thae1g
      - RUNNING_ENV=dev
      - SERVER_WIDE_MODULES=web,queue_job
      - MARABUNTA_MODE=sample # could be 'full' for the db with all the data
      - MARABUNTA_ALLOW_SERIE=True # should not be set in production

  db:
    image: camptocamp/postgresql:pg9.5-latest
    command: -c shared_buffers=256MB -c maintenance_work_mem=256MB -c wal_buffers=8MB -c effective_cache_size=1024MB
    ports:
      - 5432
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PG_SYSTEM_SHARED_BUFFERS=256MB
      - PG_SYSTEM_MAINTENANCE_WORK_MEM=256MB
      - PG_SYSTEM_WAL_BUFFERS=8MB
      - PG_SYSTEM_EFFECTIVE_CACHE_SIZE=1024MB
    volumes:
      - "data-db:/var/lib/postgresql/data"

  nginx:
    image: camptocamp/odoo-nginx:10.0-1.3.0
    depends_on:
      - odoo
    ports:
      - 80:80

volumes:
  data-odoo:
  data-db:
  data-odoo-db-cache:
  data-odoo-pytest-cache:
