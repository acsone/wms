    #     -----END RSA PRIVATE KEY-----

  # to test exports to sftp (ESB)
  esbsftp:
    image: atmoz/sftp
    command: "foo::1033"
    volumes:
      - "./sftp/share:/home/foo/share"
      - "./sftp/id_rsa.pub:/home/foo/.ssh/keys/id_rsa.pub:ro"

volumes:
  data-odoo:
  data-db:
  data-odoo-db-cache:
  data-odoo-pytest-cache:
