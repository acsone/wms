  db:
    image: camptocamp/postgresql:pg9.5-latest
    command: -c shared_buffers=256MB -c maintenance_work_mem=256MB -c wal_buffers=8MB -c effective_cache_size=1024MB
    environment:
      - POSTGRES_USER=alcyon_test
      - POSTGRES_PASSWORD=alcyon_test
    volumes:
      - "data-db:/var/lib/postgresql/data"

  nginx:
    image: camptocamp/odoo-nginx:10.0-1.4.0
    depends_on:
      - odoo
    ports:
      - 80:80

  mailhog:
    image: mailhog/mailhog
    ports:
      - 8025:8025

  # to test exports to sftp (ESB)
  esbsftp:
    image: atmoz/sftp
    command: "foo::1033"
    volumes:
      - "./sftp/share:/home/foo/share"
      - "./sftp/id_rsa.pub:/home/foo/.ssh/keys/id_rsa.pub:ro"

volumes:
  data-odoo:
  data-db:
  data-odoo-db-cache:
  data-odoo-pytest-cache:
