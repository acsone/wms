./src/odoo-addons-enterprise:
    remotes:
        odoo: git@github.com:odoo/enterprise.git
        origin: ssh://git@github.com/acsone/enterprise.git
    merges:
        - odoo master
    shell_command_after:
        # add pyproject.toml so pip wheel works
        - gh --repo acsone/enterprise pr diff 12 --patch | git am
        # remove broken/useless stuff
        - git rm -r data_cleaning
        - git commit -m "Remove unused auto install addon data_cleaning"
        - git rm -r test_marketing_automation
        - git commit -m "Remove unused auto install addon test_marketing_automation"
        - git rm -r test_mail_enterprise
        - git commit -m "Remove unused auto install addon test_mail_enterprise"
        - git rm -r l10n_bg_reports
        - git commit -m "Remove unused auto install addon l10n_bg_reports"
    target: origin 16.0-alc_master

./src/odoo:
    remotes:
        odoo: git@github.com:odoo/odoo.git
        origin: git@github.com:acsone/odoo.git
    merges:
        - odoo master
    shell_command_after:
        # pyproject.toml
        - curl -sSL https://github.com/odoo/odoo/pull/44001.patch | git am
        # 15.5 is 16.0
        - curl -sSL https://github.com/acsone/odoo/pull/62.patch | git am
        # remove broken/useless stuff
        - git rm -r addons/test_mail_sms
        - git commit -m "Remove unused auto install addon test_mail_sms"
    target: origin 16.0-alc_master
