  merges:
    - odoo 16.0
    - origin 16.0-type-annotations
    - odoo refs/pull/106512/head # [IMP] Use importlib find_spec() instead of find_module()
    - odoo refs/pull/120538/head # [IMP] product_expiry: Don't trigger move lines expiration date recomputation
    - odoo refs/pull/128732/head # [IMP] stock: Improves product.action_open_quants performances
  shell_command_after:
    # pyproject.toml
    - curl -sSL https://github.com/odoo/odoo/pull/44001.patch | git am
    # Support python -m odoo, for debugging configuration comfort.
    - curl -sL https://github.com/odoo/odoo/pull/81864.patch | git am
    # remove broken/useless stuff
    - git rm -r addons/test_mail_sms
    - git commit -m "Remove unused auto install addon test_mail_sms"
  target: origin 16.0-alc_master

