# Composition for testers, runs the latest image
#
# This file should be called with
# docker-compose -f odoo.latest.yml up
version: '2'

services:
  odoo:
    image: camptocamp/alcyon_odoo:latest
    volumes:
      - "data-odoo:/data/odoo"
    depends_on:
      - db
    environment:
      - DB_USER=alcyon_test
      - DB_PASSWORD=alcyon_test
      - DB_NAME=odoo_test
      - ADMIN_PASSWD=mijaebohb8Thae1g
      - RUNNING_ENV=dev
      - MARABUNTA_MODE=demo
      - DEMO=False

  db:
    image: camptocamp/postgresql:pg9.5-latest
    environment:
      - POSTGRES_USER=alcyon_test
      - POSTGRES_PASSWORD=alcyon_test
      - PG_SYSTEM_SHARED_BUFFERS=256MB
      - PG_SYSTEM_MAINTENANCE_WORK_MEM=256MB
      - PG_SYSTEM_WAL_BUFFERS=8MB
      - PG_SYSTEM_EFFECTIVE_CACHE_SIZE=1024MB
    volumes:
      - "data-db:/var/lib/postgresql/data"

  nginx:
    image: camptocamp/odoo-nginx:10.0-1.3.0
    depends_on:
      - odoo
    ports:
      - 80:80

volumes:
  data-odoo:
  data-db:
