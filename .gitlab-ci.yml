stages:
  - code quality
  - build
  - test
  - deploy

before_script:
  - |
    function install_acsoo {
        virtualenv --python=$PYTHON venv-acsoo
        venv-acsoo/bin/pip install acsoo==2.0.1  # pin acsoo!
        ln -s venv-acsoo/bin/acsoo
    }
    function install_pre_commit {
        virtualenv --python=$PYTHON venv-pre-commit
        venv-pre-commit/bin/pip install pre-commit
        ln -s venv-pre-commit/bin/pre-commit
    }
    function start_ssh_agent {
        eval $(ssh-agent -s)
        ssh-add <(echo "$SSH_DEPLOY_KEY")
        echo "${SSH_AGENT_PID}" > ssh-agent.pid
    }
    function makepot {
        # if you use weblate, remove --msgmerge here and install the msgmerge addon on weblate
        venv/bin/click-odoo-makepot -c odoo-ci.cfg -d ${DB_NAME} --commit --msgmerge --addons-dir=$(pwd)/odoo/local-src
        git push "git@gitlab.acsone.eu:${CI_PROJECT_PATH}" "HEAD:${CI_COMMIT_REF_NAME}"
    }
    function build_and_push_image() {
        echo "Building OCI image ${IMAGE}..."
        docker build -t ${IMAGE} .
        echo "Pushing image to GitLab Container Registry..."
        docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD}
        docker push ${IMAGE}
        echo "Removing image from Runner..."
        docker rmi ${IMAGE}
    }
    function create_gitlab_registry_secret() {
        kubectl create secret docker-registry \
            gitlab-registry \
            --docker-server="${CI_REGISTRY}" \
            --docker-username="${CI_DEPLOY_USER}" \
            --docker-password="${CI_DEPLOY_PASSWORD}" \
            --docker-email="${GITLAB_USER_EMAIL}" \
            -o yaml --dry-run | kubectl apply -f -
    }


after_script:
  # important to cleanup after ourselves to avoid
  # leaving ssh agents running on the shell executor
  - if [ -f ssh-agent.pid ] ; then kill $(cat ssh-agent.pid) ; fi
  - dropdb --if-exists ${DB_NAME}
  - rm -fr ${HOME}/.local/share/Odoo/filestore/${DB_NAME}

variables:
  PYTHON: python2.7
  DB_NAME: "${CI_PROJECT_NAME}-${CI_JOB_ID}"
  IMAGE: "${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}"

pre-commit:
  stage: code quality
  tags:
    - python
  cache:
    key: pre-commit
    paths:
    - .pre-commit
  script:
    - install_pre_commit
    - PRE_COMMIT_HOME=$PWD/.pre-commit ./pre-commit run --all-files

build:
  stage: build
  # use odoo-10.0 runner so we have the pre-cloned odoo
  # except for that optimization, we don't need odoo dependencies for this job
  tags:
    - odoo-10.0
  script:
    - start_ssh_agent
    - virtualenv --python=$PYTHON venv
    - venv/bin/pip wheel --no-deps -r setup/requirements.txt -e setup --wheel-dir=setup/release
  artifacts:
    expire_in: 1 week
    paths:
      - setup/release/
    name: "${CI_PROJECT_NAME}-${CI_JOB_ID}-build"

test:
  stage: test
  tags:
    - odoo-10.0
  script:
    - install_acsoo
    - start_ssh_agent  # for pushing translations
    - virtualenv --python=$PYTHON venv
    - venv/bin/pip install coverage -r setup/requirements-test.txt
    # use --no-index so missing dependencies that would not be in *.whl are detected
    - venv/bin/pip install --no-index setup/release/*.whl
    # although the project is part of *.whl, install it in editable mode so coverage sees it
    - venv/bin/pip install --no-index -e setup/
    - ADDONS_INIT=$(./acsoo addons --addons-dir odoo/local-src --exclude alc_all list-depends)
    - echo Installing ${ADDONS_INIT}
    - unbuffer venv/bin/click-odoo-initdb -c odoo-ci.cfg --new-database ${DB_NAME} --cache-prefix alc -m ${ADDONS_INIT} | ./acsoo checklog
    # do not test server_environment_files because server_environment depends on it,
    # so testing server_environment_files implies testing server_environment,
    # and the server_environment tests require a very specific server_environment_files
    - ADDONS_TEST=$(./acsoo addons --addons-dir odoo/local-src --exclude server_environment_files,alc_all list)
    - echo Testing ${ADDONS_TEST}
    - unbuffer venv/bin/coverage run --branch venv/bin/odoo -c odoo-ci.cfg -d ${DB_NAME} --stop-after-init --no-xmlrpc -i ${ADDONS_TEST} --test-enable | ./acsoo checklog
    - venv/bin/coverage html
    - venv/bin/coverage report
    - if [ "${CI_COMMIT_REF_NAME}" = "master" ] ; then makepot ; fi
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+\%)/'
  artifacts:
    expire_in: 1 week
    paths:
      - htmlcov/
    name: "${CI_PROJECT_NAME}-${CI_JOB_ID}-coverage-html"
  dependencies:
    - build

deploy-test:
  stage: deploy
  tags:
    - kubectl
    - docker
  script:
    - cd setup
    - build_and_push_image
    - echo "$TEST_KUBECONFIG" > .kubeconfig
    - export KUBECONFIG=$PWD/.kubeconfig
    - create_gitlab_registry_secret
    - envtpl < container/test.tpl.yaml | kubectl apply -f -
    - kubectl rollout status -w deployment/${CI_ENVIRONMENT_SLUG}
  environment:
    name: test/odoo-alcyon
    url: https://odoo-alcyon-test.acscloud-6.acsone.eu
    on_stop: stop_test
  when: manual

  only:
    - /1\.48\.\d+/
  dependencies:
    - build
  # allow failures so we can merge without running this deployment job
  allow_failure: true
    
stop_test:
  stage: deploy
  tags:
    - kubectl
  script:
    - cd setup
    - echo "$TEST_KUBECONFIG" > .kubeconfig
    - export KUBECONFIG=$PWD/.kubeconfig
    - kubectl delete service,deployment,ingress -l app=${CI_ENVIRONMENT_SLUG}
  environment:
    name: test/odoo-alcyon
    action: stop
  when: manual
  only:
    - /1\.48\.\d+/
  dependencies: []
  allow_failure: true


