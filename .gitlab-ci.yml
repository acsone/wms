stages:
  - build
  - test
  - coverage
  - build image
  - deploy

before_script:
  - |
    function install_pre_commit {
        virtualenv --python=$PYTHON venv-pre-commit
        venv-pre-commit/bin/pip install pre-commit
        ln -s venv-pre-commit/bin/pre-commit
    }
    function start_ssh_agent {
        eval $(ssh-agent -s)
        ssh-add <(echo "$SSH_DEPLOY_KEY")
        echo "${SSH_AGENT_PID}" > ssh-agent.pid
    }
    function makepot {
        # if you use weblate, remove --msgmerge here and install the msgmerge addon on weblate
        venv/bin/click-odoo-makepot -c odoo-ci.cfg -d ${DB_NAME} --commit --msgmerge --addons-dir=$(pwd)/odoo/addons
        git push "git@gitlab.acsone.eu:${CI_PROJECT_PATH}" "HEAD:${CI_COMMIT_REF_NAME}"
    }
    function create_gitlab_registry_secret() {
        kubectl create secret docker-registry \
            gitlab-registry \
            --docker-server="${CI_REGISTRY}" \
            --docker-username="${CI_DEPLOY_USER}" \
            --docker-password="${CI_DEPLOY_PASSWORD}" \
            --docker-email="${GITLAB_USER_EMAIL}" \
            -o yaml --dry-run=client | kubectl apply -f -
    }

variables:
  PYTHON: python2.7
  DB_NAME: "${CI_PROJECT_NAME}-${CI_JOB_ID}"
  IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}"

pre-commit:
  stage: test
  tags:
    - python
  cache:
    key: pre-commit
    paths:
      - .pre-commit
  variables:
    KUBERNETES_MEMORY_REQUEST: 3500Mi
    KUBERNETES_MEMORY_LIMIT: 3500Mi
  script:
    - install_pre_commit
    - PRE_COMMIT_HOME=$PWD/.pre-commit ./pre-commit run --all-files
  needs: []
  interruptible: true

build:
  stage: build
  # use odoo-10.0 runner so we have the pre-cloned odoo
  # except for that optimization, we don't need odoo dependencies for this job
  image: ghcr.io/acsone/odoo-ci-image:v20210526.0
  tags:
    - odoo-10.0
  script:
    - start_ssh_agent
    - virtualenv --python=$PYTHON venv
    - venv/bin/pip wheel --no-deps -r requirements.txt . --wheel-dir=release
  artifacts:
    expire_in: 1 week
    paths:
      - release/
    name: "${CI_PROJECT_NAME}-${CI_JOB_ID}-build"
  interruptible: true

.test_common: &test_common
  stage: test
  image: ghcr.io/acsone/odoo-ci-image:v20210526.0
  tags:
    - odoo-10.0
  dependencies:
    - build
  after_script:
    - dropdb --if-exists ${DB_NAME}
  interruptible: true

test:
  <<: *test_common
  script:
    - pipx install acsoo  # for checklog
    - start_ssh_agent # for pushing translations
    - virtualenv --python=$PYTHON venv
    - venv/bin/pip install coverage -r requirements-tests.txt
    # use --no-index so missing dependencies that would not be in *.whl are detected
    - venv/bin/pip install --no-index release/*.whl
    # although the project is part of *.whl, install it in editable mode so coverage sees it
    - venv/bin/pip install --no-deps -e .
    - manifestoo -d odoo/addons --addons-path-python=venv/bin/python check-licenses
    - ADDONS_INIT=$(manifestoo -d odoo/addons --select-exclude=alc_all,alc_shopfloor list-depends
      --separator=,)
    - echo Installing ${ADDONS_INIT}
    - unbuffer venv/bin/click-odoo-initdb -c odoo-ci.cfg --new-database ${DB_NAME}
      --cache-prefix alc -m ${ADDONS_INIT} | acsoo checklog
    # do not test server_environment_files because server_environment depends on it,
    # so testing server_environment_files implies testing server_environment,
    # and the server_environment tests require a very specific server_environment_files
    - ADDONS_TEST=$(manifestoo -d odoo/addons --select-exclude
      server_environment_files,alc_all,alc_stock_pack_operation_audit,alc_shopfloor list)
    - echo Testing ${ADDONS_TEST}
    - unbuffer venv/bin/coverage run --branch venv/bin/odoo -c odoo-ci.cfg -d ${DB_NAME}
      --stop-after-init --no-xmlrpc -i ${ADDONS_TEST} --test-enable | acsoo checklog
    - venv/bin/coverage html
    - venv/bin/coverage xml
    - venv/bin/coverage report
    - if [ "${CI_COMMIT_REF_NAME}" = "master" ] ; then makepot ; fi

  artifacts:
    expire_in: 1 day
    paths:
      - .coverage_test
    name: "${CI_PROJECT_NAME}-${CI_JOB_ID}-coverage"

test-shopfloor:
  <<: *test_common
  script:
    - pipx install acsoo  # for checklog
    - start_ssh_agent # for pushing translations
    - virtualenv --python=$PYTHON venv
    - venv/bin/pip install coverage -r requirements-tests.txt
    # use --no-index so missing dependencies that would not be in *.whl are detected
    - venv/bin/pip install --no-index release/*.whl
    # although the project is part of *.whl, install it in editable mode so coverage sees it
    - venv/bin/pip install --no-deps -e .
    - ADDONS_INIT=$(manifestoo -d odoo/addons --select=alc_shopfloor list-depends
      --separator=,)
    - echo Installing ${ADDONS_INIT}
    - unbuffer venv/bin/click-odoo-initdb -c odoo-ci.cfg --new-database ${DB_NAME}
      --cache-prefix alc-sfl -m ${ADDONS_INIT} | acsoo checklog
    # do not test server_environment_files because server_environment depends on it,
    # so testing server_environment_files implies testing server_environment,
    # and the server_environment tests require a very specific server_environment_files
    - ADDONS_TEST=$(manifestoo -d odoo/addons --select=alc_shopfloor list)
    - echo Testing ${ADDONS_TEST}
    - unbuffer venv/bin/coverage run --branch venv/bin/odoo -c odoo-ci.cfg -d ${DB_NAME}
      --stop-after-init --no-xmlrpc -i ${ADDONS_TEST} --test-enable | acsoo checklog
    - mv .coverage .coverage_shopfloor
    - if [ "${CI_COMMIT_REF_NAME}" = "master" ] ; then makepot ; fi
  artifacts:
    expire_in: 1 day
    paths:
      - .coverage_shopfloor
    name: "${CI_PROJECT_NAME}-${CI_JOB_ID}-coverage"

coverage-report:
  stage: coverage
  script:
    - virtualenv --python=$PYTHON venv
    - venv/bin/pip install coverage
    - venv/bin/coverage combine .coverage_test .coverage_shopfloor
    - venv/bin/coverage html --skip-empty --show-contexts
    - venv/bin/coverage xml
    - venv/bin/coverage report --skip-empty
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+\%)/'
  artifacts:
    expire_in: 1 day
    paths:
      - htmlcov/
      - coverage.xml
    name: "${CI_PROJECT_NAME}-${CI_JOB_ID}-coverage-html"
    expose_as: "Test coverage"
    reports:
      cobertura: coverage.xml
  dependencies:
    - test
    - test-shopfloor
  interruptible: true

build-and-publish-image:
  # https://docs.gitlab.com/ee/ci/docker/using_kaniko.html#building-a-docker-image-with-kaniko
  stage: build image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script: []
  script:
    - mkdir -p /kaniko/.docker
    - echo
      "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}"
      > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination $IMAGE
  only:
    - /1\.70\.\d+/
  needs:
    - job: build
      artifacts: true

deploy-test:
  stage: deploy
  image: quay.io/acsone/deploy-tools
  script:
    - echo "$TEST_KUBECONFIG" > .kubeconfig
    - export KUBECONFIG=$PWD/.kubeconfig
    - create_gitlab_registry_secret
    - envsubst < container/test.tpl.yaml | kubectl apply -f -
    - kubectl rollout status -w deployment/${CI_ENVIRONMENT_SLUG}
  environment:
    name: test/odoo-alcyon
    url: https://odoo-alcyon-test.acscloud-6.acsone.eu
    on_stop: stop-test
  when: manual
  only:
    - /1\.70\.\d+/

stop-test:
  stage: deploy
  image: quay.io/acsone/deploy-tools
  script:
    - echo "$TEST_KUBECONFIG" > .kubeconfig
    - export KUBECONFIG=$PWD/.kubeconfig
    - kubectl delete service,deployment,ingress -l app=${CI_ENVIRONMENT_SLUG}
  environment:
    name: test/odoo-alcyon
    action: stop
  when: manual
  only:
    - /1\.70\.\d+/
  dependencies: []
  allow_failure: true

