stages:
  - build
  - test
  - coverage
  - deploy

before_script:
  - |
    function start_ssh_agent {
        eval $(ssh-agent -s)
        ssh-add <(echo "$SSH_DEPLOY_KEY")
        echo "${SSH_AGENT_PID}" > ssh-agent.pid
    }
    function makepot {
        # if you use weblate, remove --msgmerge here and install the msgmerge addon on weblate
        venv/bin/click-odoo-makepot -c odoo-ci.cfg -d ${DB_NAME} --commit --msgmerge --addons-dir=$(pwd)/odoo/addons
        git push --push-option ci.skip "git@gitlab.acsone.eu:${CI_PROJECT_PATH}" "HEAD:${CI_COMMIT_REF_NAME}"
    }

variables:
  PYTHON: python3.10

pre-commit:
  stage: test
  image: python:3.9
  cache:
    key: pre-commit
    paths:
    - .pre-commit
  script:
    - pip install pre-commit
    - PRE_COMMIT_HOME=$PWD/.pre-commit pre-commit run --all-files --show-diff-on-failure
  needs: []
  interruptible: true

build:
  stage: build
  # use odoo-15.0 runner so we have the pre-cloned odoo
  # except for that optimization, we don't need odoo dependencies for this job
  image: ghcr.io/acsone/odoo-ci-image:v20220518.0
  tags:
    - odoo-16.0
  script:
    - start_ssh_agent
    - virtualenv --python=$PYTHON venv
    - venv/bin/pip wheel -r requirements-build.txt --wheel-dir=./release-builddeps
    - venv/bin/pip wheel --no-deps -r requirements.txt --wheel-dir=./release-deps
    - venv/bin/pip wheel --no-deps --no-index --find-links ./release-builddeps -e . --wheel-dir=./release
  artifacts:
    expire_in: 1 week
    paths:
      - release-deps/
      - release-builddeps/
      - release/
    name: "${CI_PROJECT_NAME}-${CI_JOB_ID}-build"
  interruptible: true

.test_common:
  stage: test
  tags:
    - odoo-16.0
  image: ghcr.io/acsone/odoo-ci-image:v20220518.0
  needs:
    - job: build
      artifacts: true
  interruptible: true
  after_script:
    - dropdb --if-exists ${DB_NAME}
  artifacts:
    expire_in: 1 day
    paths:
      - .coverage.*
    name: "${CI_PROJECT_NAME}-${CI_JOB_ID}-coverage"


license_check:
  extends: .test_common
  script:
    - virtualenv --python=$PYTHON venv
    - source venv/bin/activate
    - pip install --no-index --find-links ./release-deps -r requirements.txt
    - manifestoo --version
    - manifestoo -v -d odoo/addons check-licenses

dev_status_check:
  extends: .test_common
  script:
    - virtualenv --python=$PYTHON venv
    - source venv/bin/activate
    - pip install --no-index --find-links ./release-deps -r requirements.txt
    - manifestoo -d odoo/addons check-dev-status --default-dev-status=Beta

.create_test_env: &create_test_env |
  pipx install acsoo  # for checklog
  start_ssh_agent  # for pushing translations
  virtualenv --python=$PYTHON venv
  venv/bin/pip install coverage
  # install the project in editable mode (-e) so coverage sees it
  venv/bin/pip install --no-index --find-links ./release-deps --find-links ./release-builddeps -e .
  # install test dependencies
  venv/bin/pip install -r requirements-tests.txt
  ADDONS_INIT=$(manifestoo -d odoo/addons list-depends --separator=,)


test:
  extends: .test_common
  variables:
    DB_NAME: "${CI_PROJECT_NAME}-${CI_JOB_ID}"
  script:
    - *create_test_env
    - echo Installing dependent addons ${ADDONS_INIT}
    - unbuffer venv/bin/click-odoo-initdb -c odoo-ci.cfg --new-database ${DB_NAME} --cache-prefix alc -m ${ADDONS_INIT} | acsoo checklog
    - ADDONS_TEST=$(manifestoo -d odoo/addons list --separator=,)
    - PYTEST_ADDONS_TEST=$(sed -E 's/(^|,)/&odoo\/addons\//g; s/(,|$)/ /g' <<< $ADDONS_TEST)
    - echo Installing project addons ${ADDONS_TEST}
    - unbuffer venv/bin/odoo -c odoo-ci.cfg -d ${DB_NAME} --stop-after-init --no-xmlrpc -i ${ADDONS_TEST} | acsoo checklog
    - echo Running tests
    - COVERAGE_FILE=.coverage.test unbuffer venv/bin/pytest --color=yes -v --cov --cov-append --cov-report=xml --cov-report=html --odoo-config=odoo-ci.cfg --odoo-database=${DB_NAME} ${PYTEST_ADDONS_TEST}
    - if [ "${CI_COMMIT_REF_NAME}" = "master" ] ; then makepot ; fi

coverage-report:
  stage: coverage
  image: ghcr.io/acsone/odoo-ci-image:v20220518.0
  script:
    - virtualenv --python=$PYTHON venv
    - venv/bin/pip install coverage
    - venv/bin/coverage combine
    - venv/bin/coverage html --skip-empty --show-contexts
    - venv/bin/coverage xml
    - venv/bin/coverage report --skip-empty
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+\%)/'
  artifacts:
    expire_in: 1 week
    paths:
      - htmlcov/
      - coverage.xml
    name: "${CI_PROJECT_NAME}-${CI_JOB_ID}-coverage-html"
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  dependencies:
    - test

# build container images

.build-and-publish-image:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script: []
  script:
    # https://docs.gitlab.com/ee/ci/docker/using_kaniko.html#building-a-docker-image-with-kaniko
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --cache=true \
        --cache-repo=${CI_REGISTRY_IMAGE}/cache \
        --use-new-run \
        --destination ${CI_REGISTRY_IMAGE}${IMAGE_FLAVOR}:${CI_COMMIT_REF_NAME}
  needs:
    - job: build
      artifacts: true

build-image:
  extends: .build-and-publish-image
  when: manual
  allow_failure: false
  only:
    - /^\d+\.\d+\.\d+$/

build-review-image:
  extends: .build-and-publish-image
  variables:
    IMAGE_FLAVOR: /review
  environment:
    name: review/$CI_COMMIT_REF_NAME
  only:
    - branches
  except:
    - master
  when: manual

# deployments to acsone environments (review, test)

.deploy-trigger:
  image: ghcr.io/acsone/deploy-tools
  script:
    - echo "triggering deploy of ${CI_REGISTRY_IMAGE}${IMAGE_FLAVOR}:${CI_COMMIT_REF_NAME} to ${CI_ENVIRONMENT_SLUG}"
    - |
      curl --request POST \
        --form "token=${CI_JOB_TOKEN}" \
        --form "ref=deploy" \
        --form "variables[DEPLOY_ENV]=${CI_ENVIRONMENT_SLUG}" \
        --form "variables[DEPLOY_IMAGE]=${CI_REGISTRY_IMAGE}${IMAGE_FLAVOR}" \
        --form "variables[DEPLOY_COMMIT_REF_NAME]=${CI_COMMIT_REF_NAME}" \
        --form "variables[DEPLOY_COMMIT_SHA]=${CI_COMMIT_SHA}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"

deploy-dev-trigger:
  extends: .deploy-trigger
  environment:
    name: dev
  needs:
    - job: build-image
  only:
    - /^\d+\.\d+\.\d+$/

deploy-review-trigger:
  extends: .deploy-trigger
  variables:
    IMAGE_FLAVOR: /review
  environment:
    name: review/$CI_COMMIT_REF_NAME
  needs:
    - job: build-review-image
  only:
    - branches
  except:
    - master
  when: on_success # automatic after build-review-image
  allow_failure: true

deploy-test:
  stage: deploy
  tags:
    # use odoo-16.0 runner so we have the pre-cloned odoo
    # except for that optimization, we don't need odoo dependencies for this job
    - odoo-16.0
  script:
    - start_ssh_agent
    - ./deploy-test
  environment:
    name: test
    url: https://odoo-alcyon-test16.acsone.eu
  only:
    - /\d+\.\d+\.\d+/
  when: manual
  dependencies:
    - build


