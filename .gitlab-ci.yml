# /!\ pin refs when project enters maintenance phase.
include:
  - project: acsone/gitlab-ci-templates
    file: pre-commit.yml
    ref: master
  - project: acsone/gitlab-ci-templates
    file: push-pot.yml
    ref: master
  - project: acsone/gitlab-ci-templates
    file: build-publish-image-buildkit-localpods.yml
    ref: master
  - project: acsone/gitlab-ci-templates
    file: python-coverage-report.yml
    ref: master

variables:
  TRIGRAM: alc

pre-commit:
  extends: .pre-commit
  variables:
    ACIT_PYTHON_IMAGE: "python:3.11"

.test_common:
  variables:
    FF_KUBERNETES_HONOR_ENTRYPOINT: 1 # we want the odoo-bedrock image entrypoint to run
    NOGOSU: 1 # In order to run test as root. So pip install -e . can write to the venv
    DB_HOST: $PGHOST
    DB_USER: $PGUSER
    DB_PASSWORD: $PGPASSWORD
    DB_NAME: "${CI_PROJECT_NAME}-${CI_JOB_ID}"
  image: ${CI_REGISTRY_IMAGE}/dependencies:${CI_COMMIT_SHA}
  interruptible: true
  needs:
    - job: build-dependencies-image

license_check:
  extends: .test_common
  tags:
    - generic
  script:
    - manifestoo -d odoo/addons check-licenses

dev_status_check:
  extends: .test_common
  tags:
    - generic
  script:
    - manifestoo -d odoo/addons check-dev-status --default-dev-status=Beta

test:
  extends: .test_common
  services:
    - name: ghcr.io/acsone/kwkhtmltopdf:0.12.5-latest
      alias: kwkhtmltopdf
  variables:
    KWKHTMLTOPDF_SERVER_URL: http://kwkhtmltopdf:8080
  tags:
    - postgres
    - speedy
  script:
    - pip install -e .
    - ADDONS_INIT=$(manifestoo -d odoo/addons list-depends --separator=,)
    - echo Installing dependent addons ${ADDONS_INIT}
    - unbuffer click-odoo-initdb -c odoo-ci.cfg --new-database ${DB_NAME} --cache-prefix $TRIGRAM -m ${ADDONS_INIT} | checklog-odoo
    - ADDONS_TEST=$(manifestoo -d odoo/addons --select-exclude=alc_all,alce_all list --separator=,)
    - PYTEST_ADDONS_TEST=$(sed -E 's;([^,]+)(,|$);odoo/addons/\1 ;g' <<< $ADDONS_TEST)
    - echo Installing ${ADDONS_TEST}
    - unbuffer odoo -c odoo-ci.cfg -d ${DB_NAME} --stop-after-init -i ${ADDONS_TEST} | checklog-odoo
    - echo Testing ${PYTEST_ADDONS_TEST}
    - unbuffer coverage run -m pytest --odoo-http --color=yes -v --durations=0 --durations-min=2 --odoo-config=odoo-ci.cfg --odoo-database=${DB_NAME} ${PYTEST_ADDONS_TEST}
    - if [ "${CI_COMMIT_REF_NAME}" = "master" ] ; then click-odoo-makepot -c odoo-ci.cfg -d ${DB_NAME} --addons-dir=odoo/addons ; fi
  after_script:
    - dropdb --if-exists ${DB_NAME}
  artifacts:
    expire_in: 1 week
    paths:
      - odoo/addons/**/*.pot
      - .coverage.*

coverage:
  extends: .python-coverage-report
  needs:
    - job: test
      artifacts: true

push-pot:
  extends: .push-pot
  variables:
    ACIT_SSH_KEY: $SSH_DEPLOY_KEY
  needs:
    - job: test
      artifacts: true

# build container images

.build-publish-image:
  extends: .build-publish-image-buildkit-localpods
  variables:
    ACIT_SSH_KEY: $SSH_DEPLOY_KEY

build-dependencies-image:
  extends: .build-publish-image
  variables:
    ACIT_IMAGE_BUILD_TARGET: dependencies
    ACIT_IMAGE_FLAVOR: /dependencies
    ACIT_IMAGE_TAG: $CI_COMMIT_SHA

build-review-image:
  extends: .build-publish-image
  variables:
    ACIT_IMAGE_FLAVOR: /review16
  only:
    - branches
  except:
    - master
  needs:
    - job: build-dependencies-image
  when: manual

build-test-image:
  extends: .build-publish-image
  variables:
    ACIT_IMAGE_FLAVOR: /test16
  only:
    - /^\d+\.\d+\.\d+$/
  needs:
    - job: build-dependencies-image

build-uat-image:
  extends: .build-publish-image
  variables:
    ACIT_IMAGE_FLAVOR: /uat16
  only:
    - /^\d+\.\d+\.\d+$/
  needs:
    - job: build-dependencies-image
  when: manual

build-prod-image:
  extends: .build-publish-image
  variables:
    ACIT_IMAGE_FLAVOR: /prod16
  only:
    - /^\d+\.\d+\.\d+$/
  needs:
    - job: build-dependencies-image
  when: manual

# deployments

.deploy-trigger:
  tags:
    - generic
  image: ghcr.io/acsone/deploy-tools
  script:
    - echo "triggering deploy of ${CI_REGISTRY_IMAGE}${IMAGE_FLAVOR}:${CI_COMMIT_REF_NAME} to ${CI_ENVIRONMENT_NAME}"
    - |
      curl --request POST \
        --form "token=${CI_JOB_TOKEN}" \
        --form "ref=${DEPLOY_BRANCH}" \
        --form "variables[DEPLOY_ENV]=${DEPLOY_ENV:-$CI_ENVIRONMENT_NAME}" \
        --form "variables[DEPLOY_IMAGE]=${CI_REGISTRY_IMAGE}${IMAGE_FLAVOR}" \
        --form "variables[DEPLOY_COMMIT_REF_NAME]=${CI_COMMIT_REF_NAME}" \
        --form "variables[DEPLOY_COMMIT_SHA]=${CI_COMMIT_SHA}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"

deploy-review-trigger:
  extends: .deploy-trigger
  variables:
    DEPLOY_BRANCH: deploy-test
    DEPLOY_ENV: review16/${CI_COMMIT_REF_NAME}
    IMAGE_FLAVOR: /review16
  needs:
    - job: build-review-image
  only:
    - branches
  except:
    - master

deploy-test-trigger:
  extends: .deploy-trigger
  variables:
    DEPLOY_BRANCH: deploy-test
    IMAGE_FLAVOR: /test16
  environment:
    name: test16
  needs:
    - job: build-test-image
  only:
    - /^\d+\.\d+\.\d+$/

deploy-uat-trigger:
  extends: .deploy-trigger
  variables:
    DEPLOY_BRANCH: deploy-test
    IMAGE_FLAVOR: /uat16
  environment:
    name: uat16
  needs:
    - job: build-uat-image
  only:
    - /^\d+\.\d+\.\d+$/

deploy-prod-trigger:
  extends: .deploy-trigger
  variables:
    DEPLOY_BRANCH: deploy-prod
    IMAGE_FLAVOR: /prod16
  environment:
    name: prod16
  needs:
    - job: build-prod-image
  only:
    - /^\d+\.\d+\.\d+$/
