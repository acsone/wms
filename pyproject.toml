# Use the hatchling build backend, with the hatch-odoo plugin.
[build-system]
requires = ["hatchling", "setuptools-odoo>=3.1.4", "hatch-odoo"]
build-backend = "hatchling.build"

# The standard project metadata section
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[project]
name = "odoo-addons-alcyon"
version = "16.0.2.17.0"
readme = "README.rst"
#license = "LicenseRef-Proprietary"  # waiting for hatchling>1.8.1
requires-python = "==3.11.*"
# Dependencies are dynamic because they will be generated from Odoo addons manifests.
dynamic = ["dependencies"]

[project.optional-dependencies]
test = [
  "coverage",
  "pytest-cov",
  "pytest-odoo",
  "pytest-subtests",
  "pygments",
  "freezegun",
  "odoo-test-helper",
  "python-dateutil",
  "manifestoo",
  "httpx",
  "vcrpy-unittest",
  "checklog-odoo",
  "mock",
  "websocket-client",
]
dev = [
  "ipython",
]

[project.scripts]
migrate-module = 'scripts.migrate_module:main'

# Enable the hatch-odoo metadata hook to generate dependencies from addons manifests.
[tool.hatch.metadata.hooks.odoo-addons-dependencies]

[tool.hatch-odoo]
# If our addons have non standard version numbers, let's help hatch-odoo discover the Odoo version.
odoo_version_override = "16.0"
# Dependencies that are not declared in Odoo addons manifests.
dependencies = [
  "click-odoo-contrib>=1.4.1",
  "openupgradelib",
  "odoo-addons-enterprise",
  "typodoo",
  "typing_extensions", # Should be declared into typodoo
  # optional Odoo dependencies
  "num2words",
  "pdfminer",
  # addons we want in the package but not installed
  "odoo-addon-sentry",
  "odoo-addon-session_db",
  "odoo-addon-database-cleanup",
  # xlrd >= 2 removes xlsx support for anything other than .xls files
  # https://xlrd.readthedocs.io/en/latest/changes.html#id1
  "xlrd<2",
  #reportlab<4 to avoid dependency on pycairo which is not available as a wheel
  "reportlab<4",
  # fs_storage with s3
  "s3fs"
]
addons_dirs = ["odoo/addons"]

[tool.hatch.build]
packages = ["odoo"]

[tool.black]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.tox
    | \.venv
)/
| /__manifest__.py
'''


[tool.mypy]
ignore_missing_imports = true
exclude = [
  'post-migrate',
  'pre-migrate',
  'pre-migration',
  # MYPY NOT INSTALLABLE ADDONS
  'odoo/addons/account_payment_order_background/*',
  'odoo/addons/alc_country/*',
  'odoo/addons/alc_db_cleaner/*',
  'odoo/addons/alc_eshop_auth_api_key/*',
  'odoo/addons/alc_mrp_repair/*',
  'odoo/addons/alc_partner_delivery_person/*',
  'odoo/addons/alc_partner_delivery_window_import/*',
  'odoo/addons/alc_print_all_deliveryslip/*',
  'odoo/addons/alc_purchase_order_import_ubl/*',
  'odoo/addons/alc_shopfloor_mobile_workstation/*',
  'odoo/addons/alc_standby_delivery/*',
  'odoo/addons/alc_stock_picking_number_package/*',
  'odoo/addons/alc_stock_picking_wave_type/*',
  'odoo/addons/alc_stock_storage_type/*',
  'odoo/addons/alce_purchase_report/*',
  'odoo/addons/base_cached_xmlid/*',
  'odoo/addons/l10n_be_vat/*',
  'odoo/addons/partner_archive_new_partner/*',
  'odoo/addons/stock_inventory_constrains/*',
  'odoo/addons/test_alc_shopfloor_stock_issue_product_additional/*'
  # MYPY END NOT INSTALLABLE ADDONS
]
[tool.ruff]
target-version = "py310"
fix = true
# https://beta.ruff.rs/docs/rules/
select = [
  "F", # Pyflakes
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "B", # flake8-bugbear
  "C90", # mccabe
  "C",  # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (covered by B950)
  "E741", # Ambiguous variable name 'l'
]
ignore-init-module-imports = true

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # ignore unused imports in __init__.py

[tool.pip-deepfreeze.sync]
extras = "test,dev"
post_sync_commands = [
  "pip-preserve-requirements requirements*.txt",
]

[tool.pip-preserve-requirements]
tag_prefix = "16.0+alc+"
match_any_tag = true

[[tool.pip-preserve-requirements.vcs_vaults]]
provider = "github.com"
owner = "acsone"
default = true
